const $=id=>document.getElementById(id);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function preference(){try{return localStorage.getItem('carspyLanguage')||localStorage.getItem('carspyPrivacyLanguage')}catch{return null}}
function remember(code){try{localStorage.setItem('carspyLanguage',code);localStorage.setItem('carspyPrivacyLanguage',code)}catch{}}
function initialLanguage(){const raw=preference()||navigator.language||'tr';return LANGUAGES.some(l=>l[0]===raw)?raw:raw.startsWith('pt')?'pt-BR':LANGUAGES.some(l=>l[0]===raw.split('-')[0])?raw.split('-')[0]:'en'}
function commonLanguage(code,tag,privacyTitle){document.documentElement.lang=code;document.documentElement.dir=code==='ar'?'rtl':'ltr';$('languageSelect').value=code;$('brandTagline').textContent=tag;$('languageLabel').textContent=UI[code][2];$('navHome').textContent=UI[code][0];$('navPrivacy').textContent=privacyTitle;$('footerHome').textContent=UI[code][0];$('footerPrivacy').textContent=privacyTitle;$('backTop').textContent=UI[code][7]+' ↑';remember(code)}
let revealObserver;
function observeReveals(){if(!('IntersectionObserver'in window))return;if(!revealObserver){revealObserver=new IntersectionObserver(entries=>entries.forEach(e=>e.target.classList.toggle('visible',e.isIntersecting)),{rootMargin:'0px 0px -45px 0px',threshold:0});document.documentElement.classList.add('motion-ready')}document.querySelectorAll('.reveal').forEach(el=>{revealObserver.unobserve(el);const r=el.getBoundingClientRect();el.classList.toggle('visible',r.bottom>0&&r.top<innerHeight-45);revealObserver.observe(el)})}
let readingFrame=0;addEventListener('scroll',()=>{if(readingFrame)return;readingFrame=requestAnimationFrame(()=>{readingFrame=0;const max=document.documentElement.scrollHeight-innerHeight;document.documentElement.style.setProperty('--read-progress',max>0?scrollY/max:0)})},{passive:true});

let currentSlide=0,cardWidth=600,offset=0,drag=null,activeLanguage='tr';
const viewport=$('gameCarousel'),track=$('carouselTrack'),dots=$('carouselDots'),prev=$('prevSlide'),next=$('nextSlide');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function targetOffset(){return (viewport.clientWidth-cardWidth)/2-currentSlide*(cardWidth+24)}
function paint(extra=0,animate=true){offset=targetOffset()+extra;track.style.transition=animate&&!reduced.matches?'transform 500ms cubic-bezier(.22,1,.36,1)':'none';track.style.transform='translate3d('+offset+'px,0,0)';track.dataset.index=currentSlide;prev.disabled=currentSlide===0;next.disabled=currentSlide===track.children.length-1;[...track.children].forEach((el,i)=>el.classList.toggle('active',i===currentSlide));[...dots.children].forEach((b,i)=>{b.classList.toggle('active',i===currentSlide);b.setAttribute('aria-current',String(i===currentSlide))});$('carouselCount').textContent=String(currentSlide+1).padStart(2,'0')+' / '+String(track.children.length).padStart(2,'0')}
function goSlide(index,animate=true){currentSlide=Math.max(0,Math.min(track.children.length-1,index));paint(0,animate)}
function measure(){cardWidth=Math.min(620,viewport.clientWidth*(viewport.clientWidth<640?.82:.65));viewport.style.setProperty('--card-width',cardWidth+'px');paint(0,false)}
function renderExperience(code){const d=D[code],u=UI[code];$('gameKicker').textContent=d.k;$('gameTitle').textContent=d.t;$('gameIntro').textContent=d.i;$('downloadTitle').textContent=d.download;$('appStoreSmall').textContent=d.app;$('playStoreSmall').textContent=d.play;$('soloStat').textContent=d.cards[0][3];$('arenaStat').textContent=d.cards[1][5].slice(0,2).join(' · ');$('languageStat').textContent=u[8];$('heroDownload').textContent=u[1];prev.setAttribute('aria-label',u[3]);next.setAttribute('aria-label',u[4]);viewport.setAttribute('aria-label',d.t);
track.innerHTML=d.cards.map(([symbol,tag,color,title,body,pills],i)=>'<article class="slide" style="--accent:'+color+';--tint:'+color+'24" role="group" aria-label="'+escapeHTML(u[5]+' '+(i+1)+' / '+d.cards.length)+'" data-slide="'+i+'"><div class="slide-top"><span class="slide-symbol" aria-hidden="true">'+symbol+'</span><span class="slide-index">'+String(i+1).padStart(2,'0')+' / 08</span></div><div class="slide-tag">'+escapeHTML(tag)+'</div><h3>'+escapeHTML(title)+'</h3><p>'+escapeHTML(body)+'</p><div class="slide-list">'+pills.map(p=>'<span>'+escapeHTML(p)+'</span>').join('')+'</div></article>').join('');
dots.innerHTML=d.cards.map((card,i)=>'<button class="dotnav" type="button" data-go="'+i+'" aria-label="'+escapeHTML(u[5]+' '+(i+1)+': '+card[3])+'"></button>').join('');currentSlide=0;drag=null;measure();}
function setLanguage(code){if(!T[code])code='en';activeLanguage=code;const x=T[code];commonLanguage(code,x.tag,x.privacy);document.title='CarSpy — '+x.tag;document.querySelector('meta[name="description"]').content=x.lead;document.querySelector('meta[property="og:title"]').content=document.title;document.querySelector('meta[property="og:description"]').content=x.lead;document.querySelectorAll('[data-text]').forEach(el=>el.textContent=x[el.dataset.text]);if(revealObserver)document.querySelectorAll('#features .reveal').forEach(el=>revealObserver.unobserve(el));$('features').innerHTML=x.features.map(([symbol,title,body])=>'<article class="feature reveal"><span class="feature-icon" aria-hidden="true">'+symbol+'</span><h3>'+escapeHTML(title)+'</h3><p>'+escapeHTML(body)+'</p></article>').join('');renderExperience(code);observeReveals()}
prev.addEventListener('click',()=>goSlide(currentSlide-1));next.addEventListener('click',()=>goSlide(currentSlide+1));dots.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)goSlide(Number(b.dataset.go))});
viewport.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0||e.target.closest('button'))return;drag={id:e.pointerId,startX:e.clientX,startY:e.clientY,dx:0,horizontal:false,startIndex:currentSlide,card:e.target.closest('[data-slide]')};viewport.setPointerCapture(e.pointerId)});
viewport.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;if(!drag.horizontal){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){cancelDrag();return}if(Math.abs(dx)<8)return;drag.horizontal=true;viewport.classList.add('dragging')}drag.dx=dx;const edge=(currentSlide===0&&dx>0)||(currentSlide===track.children.length-1&&dx<0);paint(edge?dx*.15:Math.max(-cardWidth*.75,Math.min(cardWidth*.75,dx)),false)});
function releaseDrag(){const id=drag?.id;drag=null;viewport.classList.remove('dragging');if(id!==undefined&&viewport.hasPointerCapture(id))viewport.releasePointerCapture(id)}

viewport.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;const state=drag;releaseDrag();if(state.horizontal){const threshold=Math.min(70,cardWidth*.16);goSlide(state.startIndex+(Math.abs(state.dx)>=threshold?(state.dx<0?1:-1):0))}else if(state.card){const i=Number(state.card.dataset.slide);goSlide(currentSlide+Math.sign(i-currentSlide))}});
viewport.addEventListener('pointercancel',cancelDrag);viewport.addEventListener('lostpointercapture',cancelDrag);viewport.addEventListener('dragstart',e=>e.preventDefault());viewport.addEventListener('keydown',e=>{if(e.target.closest('button'))return;const commands={ArrowRight:currentSlide+1,ArrowLeft:currentSlide-1,Home:0,End:track.children.length-1};if(e.key in commands){e.preventDefault();goSlide(commands[e.key])}});
if('ResizeObserver'in window)new ResizeObserver(()=>{cancelDrag();measure()}).observe(viewport);else addEventListener('resize',measure);$('languageSelect').addEventListener('change',e=>setLanguage(e.target.value));setLanguage(initialLanguage());
